<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ColorOS 软件更新</title>
<style>
  :root{
    --fg:#ffffff; --line:rgba(255,255,255,.12);
    --card:rgba(26,24,38,.46); --blue:#2f6bff; --blue2:#4d86ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    color:var(--fg);overflow:hidden;
    font-family:-apple-system,"OPPOSans","Oplus Sans","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;
    /* Official hero artwork (bg_purple_type0 from OPPO's update H5). */
    background:#241d49 url(assets/bg.webp) center center/cover no-repeat fixed;
  }

  .hero{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
        justify-content:center;text-align:center;padding:8vh 20px 4vh;min-height:38vh}
  .big{
    font-size:118px;line-height:.92;font-weight:700;letter-spacing:0;
    background:linear-gradient(180deg,#ffffff 6%,#ffe6d2 44%,#e7bcff 98%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .numimg{width:min(46vw,168px);height:auto;display:block}
  .brand{margin-top:10px;font-size:34px;font-weight:600;opacity:.96}
  .model{margin-top:10px;font-size:19px;color:rgba(255,255,255,.72)}

  .sheet{
    position:relative;flex:1;margin:0 14px 12px;border-radius:22px;
    background:#141024 url(assets/card.webp) center/cover no-repeat;
    border:1px solid rgba(255,255,255,.09);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet::before{content:"";position:absolute;inset:0;background:rgba(11,9,19,.60);
                 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
  .sheet>*{position:relative}
  .sheet .scroll{overflow-y:auto;padding:20px 20px 12px}
  .h1{margin:0 0 10px;font-size:21px;font-weight:600}
  .verline{margin:0 0 16px;font-size:16px;color:rgba(255,255,255,.88);word-break:break-all}
  .rule{height:1px;background:var(--line);margin:0 -20px 4px}

  .head{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
  .head .t{font-size:22px;font-weight:700}
  .chev{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.10);color:var(--fg);padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .chev svg{width:16px;height:16px;display:block;transition:transform .22s ease}
  .chev[data-open="false"] svg{transform:rotate(180deg)}

  .body{padding-bottom:6px}
  .body.hidden{display:none}
  .headline{margin:6px 0 14px;font-size:17px;font-weight:700}
  .body p{margin:0 0 14px;font-size:15px;line-height:1.72;color:rgba(255,255,255,.84)}
  .body h4{margin:18px 0 10px;font-size:16px;font-weight:700}
  .body h4:first-child{margin-top:6px}
  .body ul{margin:0 0 14px;padding:0;list-style:none}
  .body li{position:relative;margin:0 0 10px;padding-left:15px;
           font-size:15px;line-height:1.7;color:rgba(255,255,255,.84)}
  .body li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;
                   border-radius:50%;background:rgba(255,255,255,.45)}

  .foot{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
        display:flex;justify-content:center}
  .pill{
    position:relative;width:100%;height:54px;border-radius:27px;overflow:hidden;
    background:linear-gradient(92deg,var(--blue),var(--blue2));color:#fff;border:0;
    font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .pill .fill{position:absolute;left:0;top:0;bottom:0;width:0;
              background:rgba(255,255,255,.28);transition:width .35s ease}
  .pill .lbl{position:relative}
  .pill[disabled]{opacity:.55;pointer-events:none}

  #dbg{position:fixed;left:8px;right:8px;bottom:8px;max-height:32vh;overflow:auto;
       font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;background:rgba(0,0,0,.78);
       border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px;display:none;z-index:9}
</style>
</head>
<body>
  <div class="hero">
    <div id="bigWrap"><div class="big" id="bigVer">17</div></div>
    <div class="brand">ColorOS</div>
    <div class="model" id="modelLine"></div>
  </div>

  <section class="sheet">
    <div class="scroll">
      <h1 class="h1">软件版本</h1>
      <p class="verline" id="verline">--</p>
      <div class="rule"></div>
      <div class="head">
        <span class="t" id="series">ColorOS 17</span>
        <button class="chev" id="chev" data-open="true" aria-label="收起">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="body" id="body">
        <p class="headline" id="headline">发现新版本</p>
        <div id="log"></div>
      </div>
    </div>
    <div class="foot">
      <button class="pill" id="pill"><span class="fill" id="fill"></span><span class="lbl" id="pillLbl">下载并安装</span></button>
    </div>
  </section>

  <pre id="dbg"></pre>

<script>
/* ---- official RainbowBridge JS shim (recovered from the h5fs.coloros.com bundle) ---- */
var ue = window, ce = ue.navigator.userAgent, de = 1;
var Ae = ue.RainbowBridge || (ue.RainbowBridge = {});
var pe = {
  callMethod: function (host, method, data, cb) {
    var port = me.generatePort();
    if (typeof cb !== "function") cb = null;
    me.registerCallback(port, cb);
    me.callNativeMethod(host, port, method, data);
  },
  onComplete: function (port, json) { me.onNativeComplete(port, json); }
};
var me = {
  callbacks: {},
  registerCallback: function (p, cb) { if (cb) me.callbacks[p] = cb; },
  getCallback: function (p) { return { callback: me.callbacks[p] || null }; },
  unRegisterCallback: function (p) { if (me.callbacks[p]) delete me.callbacks[p]; },
  onNativeComplete: function (p, json) {
    var cb = me.getCallback(p).callback;
    me.unRegisterCallback(p);
    if (cb) cb(me.str2Json(json));
  },
  generatePort: function () { return String(Math.floor(Math.random() * (1 << 50))) + (de++); },
  str2Json: function (s) {
    if (!s || typeof s !== "string") return s || {};
    try { return JSON.parse(s.replace(/\n/g, "\\n").replace(/\r/g, "\\r")); }
    catch (e) { return { status: { code: 1, msg: "params parse error!" } }; }
  },
  json2Str: function (o) { return o && typeof o === "object" ? JSON.stringify(o) : (o || ""); },
  callNativeMethod: function (host, port, method, data) {
    if (me.isAndroid()) {
      ue.prompt("rainbow://" + host + ":" + port + "/" + method + "?" + me.json2Str(data), "");
    }
  },
  isAndroid: function () { return ce.toLowerCase().indexOf("android") > -1; },
  isIos: function () { return ce.toLowerCase().indexOf("iphone") > -1; }
};
for (var k in pe) if (pe.hasOwnProperty(k) && !Object.prototype.hasOwnProperty.call(Ae, k)) Ae[k] = pe[k];

function callNative(method, data) {
  return new Promise(function (resolve) {
    Ae.callMethod("JSCommandMethod", method, data || {}, resolve);
  });
}
var DEBUG = /[\?&]debug=1/.test(location.search);
function dbg(o) {
  if (!DEBUG) return;
  var el = document.getElementById("dbg");
  el.style.display = "block";
  el.textContent += (typeof o === "string" ? o : JSON.stringify(o, null, 1)) + "\n";
}

/* ---- native -> JS entry points ---- */
var downloading = false;
window.updateButton = function (json) {
  dbg(["updateButton", json]);
  var o = typeof json === "string" ? JSON.parse(json) : (json || {});
  var lbl = document.getElementById("pillLbl");
  if (o.noticeContent) document.getElementById("headline").textContent = o.noticeContent;
  var p = parseFloat(o.progress);
  var pct = (!isNaN(p) && p > 0) ? Math.min(100, p) : 0;
  if (pct > 0) {
    downloading = true;
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("pill").removeAttribute("disabled");
  }
  /* Native formats the current phase itself ("正在下载 x%" while downloading,
     "正在安装 x%" while update_engine applies). Only fall back to our own
     wording when it sends no button text. */
  if (o.positiveButton) lbl.textContent = o.positiveButton;
  else if (pct > 0) lbl.textContent = "正在下载 " + pct + "%";
  if (o.positiveButtonState === "false" || o.positiveButtonState === false)
    document.getElementById("pill").setAttribute("disabled", "disabled");
};
window.setScreen = function (json) { dbg(["setScreen", json]); };
window.updateOtaInfo = function () { dbg("updateOtaInfo"); refresh(); };
window.notifyH5OnResume = function () { dbg("notifyH5OnResume"); };
window.notifyH5EntryOTATheme = function () { dbg("notifyH5EntryOTATheme"); };
window.notifyH5ExitFullScreen = function () { dbg("notifyH5ExitFullScreen"); };
window.notifyH5DetectState = function (json) { dbg(["notifyH5DetectState", json]); };
window.onBeforeCloseH5 = function () { dbg("onBeforeCloseH5"); };

/* ---- render ---- */
function fmtSize(n) {
  if (typeof n === "string") {
    var s = n.trim();
    if (s && isNaN(Number(s))) return s;     /* native already formatted it */
    n = Number(s);
  }
  n = Number(n);
  if (!n || isNaN(n)) return "";
  var u = ["B", "KB", "MB", "GB"], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i >= 3 ? n.toFixed(2) : n.toFixed(1)) + " " + u[i];
}
function esc(s) { return String(s == null ? "" : s); }
function htmlEsc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
/* The device's own manifest (dist/<DEVICE>.json): it carries this port's
   release changelog and the display name for the model line. The page asks the
   native side for the device code and fetches the manifest from the CDN, so the
   changelog shown is the one shipped with that device's package. */
var MANIFEST_BASES = [
  "https://cdn.jsdelivr.net/gh/toraidl/ColorOS-Port-OTA@main/dist/",
  "https://raw.githubusercontent.com/toraidl/ColorOS-Port-OTA/main/dist/"
];
function loadManifest(code) {
  if (!code) return Promise.resolve(null);
  var i = 0;
  function next() {
    if (i >= MANIFEST_BASES.length) return Promise.resolve(null);
    var url = MANIFEST_BASES[i++] + encodeURIComponent(code) + ".json";
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      return r.ok ? r.json() : next();
    }).catch(function () { return next(); });
  }
  return next();
}

/* Full official changelog, snapshotted from OPPO's CDN into changelog.json. */
function loadChangelog() {
  return fetch("changelog.json", { cache: "no-cache" }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (data) {
    var secs = data && data.sections;
    if (!secs || !secs.length) return false;
    var html = "";
    var headline = secs[0] && secs[0].title ? secs[0].title : "";
    secs.forEach(function (s, idx) {
      /* the first section title is promoted to the card headline */
      if (s.title && !(idx === 0 && headline)) html += "<h4>" + htmlEsc(s.title) + "</h4>";
      if (s.items && s.items.length) {
        html += "<ul>" + s.items.map(function (i) {
          return "<li>" + htmlEsc(i) + "</li>";
        }).join("") + "</ul>";
      }
    });
    if (html) {
      document.getElementById("log").innerHTML = html;
      if (headline) document.getElementById("headline").textContent = headline;
      return true;
    }
    return false;
  }).catch(function () { return false; });
}
function major(v) {
  var m = /(\d+)\s*\./.exec(String(v || ""));
  if (m) return m[1];
  m = /(\d+)/.exec(String(v || ""));
  return m ? m[1] : "17";
}
function render(info) {
  var d = (info && info.data) || {};
  var ver = major(d.osVersion || d.androidVersion || d.newVersion);
  /* Official numeral artwork for ColorOS 17; text fallback for anything else. */
  document.getElementById("bigWrap").innerHTML = (ver === "17")
    ? '<img class="numimg" src="assets/number.webp" alt="17">'
    : '<div class="big">' + ver + '</div>';
  document.getElementById("modelLine").textContent = d.model || "";
  var size = fmtSize(d.size);
  document.getElementById("verline").textContent =
    esc(d.newVersion || d.otaVersion || "--") + (size ? " | " + size : "");
  var series = /(\d+)/.exec(String(d.osVersion || d.androidVersion || ""));
  if (series) document.getElementById("series").textContent = "ColorOS " + series[1];
  var msg = esc(d.message || d.content || "");
  var head = document.getElementById("headline");
  var log = document.getElementById("log");
  var parts = msg.split(/\n+/).filter(function (x) { return x.trim(); });
  if (parts.length > 1) { head.textContent = parts[0]; parts = parts.slice(1); }
  else { head.textContent = "发现新版本"; }
  log.innerHTML = parts.map(function (p) { return "<p>" + p + "</p>"; }).join("") ||
                  "<p>本次更新包含系统稳定性与兼容性改进。</p>";
  /* Prefer this device's own manifest: its description is the release
     changelog of the package the card points at, and displayName is the model
     string to show. Fall back to the official ColorOS changelog. */
  var code = String(d.model || "").trim();
  loadManifest(code).then(function (m) {
    if (m) {
      if (m.displayName) document.getElementById("modelLine").textContent = m.displayName;
      if (m.summary) head.textContent = m.summary;
      if (m.description) { log.innerHTML = m.description; return; }
    }
    loadChangelog();
  });
}
function refresh() {
  callNative("getOtaInfo", {}).then(function (r) {
    dbg(["getOtaInfo ->", r]);
    render(r);
    var d = (r && r.data) || {};
    if (d.updateButton) window.updateButton(d.updateButton);
    showWebView();
  });
}

/* Native keeps the WebView hidden behind the stock loading view until the page
   asks for it. showLoading({show:false}) also runs FragmentBusy.F(), which
   cancels the 15s "no connection" watchdog armed when the page was loaded. */
var shown = false;
function showWebView() {
  if (shown) return;
  shown = true;
  callNative("showLoading", {
    show: false, error: false,
    height: Math.round(document.documentElement.scrollHeight || 0)
  }).then(function (r) { dbg(["showLoading ->", r]); });
}

/* ---- actions ---- */
document.getElementById("chev").addEventListener("click", function () {
  var open = this.getAttribute("data-open") === "true";
  this.setAttribute("data-open", open ? "false" : "true");
  this.setAttribute("aria-label", open ? "展开" : "收起");
  document.getElementById("body").className = open ? "body hidden" : "body";
});
document.getElementById("pill").addEventListener("click", function () {
  if (downloading) return;
  this.setAttribute("disabled", "disabled");
  /* "positiveButton" is the type FragmentBusy.l() routes to
     EntryActivity.prepareDownload(); "highLight" goes to the beta-invite flow. */
  callNative("onClickButtonFromH5", { type: "positiveButton" }).then(function (r) {
    dbg(["download ->", r]);
    var code = r && r.status ? r.status.code : 1;
    if (code !== 0) document.getElementById("pill").removeAttribute("disabled");
  });
});

refresh();
setTimeout(showWebView, 1500);
</script>
</body>
</html>
